version: '3.8'

services:
  db:
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/backups

  api:
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  web:
    restart: always